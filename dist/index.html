<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MD Decision Lab 프로젝트 프레젠테이션" />
    <title>MD Decision Lab · Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="프레젠테이션 목차">
        <div class="sidebar-head">
          <a class="brand" href="#slide-1" aria-label="첫 페이지로 이동">
            <span class="brand-mark">MD</span>
            <span>
              <strong>MD Decision Lab</strong>
              <small>상품 운영 판단 도구</small>
            </span>
          </a>
          <p class="sidebar-intro">판매와 재고 데이터를 판단 가능한 정보로 바꾸고, 전략 실행 전 손익을 비교합니다.</p>
        </div>

        <nav class="toc" id="toc"></nav>

        <div class="sidebar-foot">
          <span>JEONGMIN · 2026</span>
          <button type="button" id="fullscreenBtn" class="text-button">전체 화면</button>
        </div>
      </aside>

      <div class="scrim" id="scrim" aria-hidden="true"></div>

      <main class="main-stage">
        <header class="topbar">
          <button type="button" id="menuBtn" class="icon-button menu-button" aria-label="목차 열기" aria-expanded="false">
            <span></span><span></span><span></span>
          </button>
          <div class="current-location">
            <span id="currentGroup">소개</span>
            <strong id="currentTitle">표지</strong>
          </div>
          <div class="page-count"><strong id="currentNumber">01</strong><span>/ 19</span></div>
        </header>

        <section class="viewer" aria-live="polite">
          <button type="button" class="slide-arrow prev" id="prevBtn" aria-label="이전 슬라이드">←</button>
          <figure class="slide-frame" id="slideFrame">
            <img id="slideImage" src="assets/slides/slide-01.png" alt="MD Decision Lab 표지" />
          </figure>
          <button type="button" class="slide-arrow next" id="nextBtn" aria-label="다음 슬라이드">→</button>
        </section>

        <footer class="controlbar">
          <p><kbd>←</kbd><kbd>→</kbd> 키로 이동</p>
          <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
          <p id="slideTitleFooter">데이터 파악은 단숨에, 다음 시즌 예측은 확실하게</p>
        </footer>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
